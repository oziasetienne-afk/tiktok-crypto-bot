name: Daily TikTok Crypto Script

on:
  schedule:
    # 07:00 UTC = 09:00 Paris (été/CEST) — 08:00 Paris en hiver/CET.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour tester à la demande

permissions:
  contents: write   # pour committer l'audio MP3 (optionnel)
  issues: write     # pour ouvrir l'Issue qui t'envoie l'email

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily TikTok bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python daily_tiktok.py
