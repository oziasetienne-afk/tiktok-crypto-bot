name: Daily TikTok Crypto Script

on:
  schedule:
    # 07:00 UTC = 09:00 Paris (été/CEST) — 08:00 Paris en hiver/CET.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour tester à la demande

permissions:
  models: read      # inference gratuite via GitHub Models (le GITHUB_TOKEN suffit)
  contents: write   # pour committer la vidéo dans le repo
  issues: write     # pour ouvrir l'Issue qui t'envoie l'email

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System deps (ffmpeg + police)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily TikTok bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python daily_tiktok.py
