name: WarframeCompanion
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  WarframeCompanion:
    type: application
    platform: iOS
    sources:
      - path: WarframeCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.warframecompanion
        PRODUCT_NAME: WF Market
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WF Market
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

schemes:
  WarframeCompanion:
    build:
      targets:
        WarframeCompanion: all
    run:
      config: Debug
    archive:
      config: Release
